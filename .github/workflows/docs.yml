name: docs

on:
  pull_request:
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter vibedeckx-docs...
      - run: pnpm --filter vibedeckx-docs build
      # Deploys the assets-only Worker in apps/docs/wrangler.jsonc (serves docs.vibedeckx.dev).
      # Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Workers Routes: Edit on
      # the vibedeckx.dev zone) and CLOUDFLARE_ACCOUNT_ID.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: apps/docs
        run: npx -y wrangler@4.146.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
