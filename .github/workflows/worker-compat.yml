name: worker-compat

# Server/worker compat gates (docs/server-worker-compat-design.md):
# - classify-diff: bucket the PR's files by server/worker impact into the job
#   summary (fast signal; the enforcing check is the capability-registry test
#   already run by test.yml).
# - cross-version-e2e matrix {compat floor 0.2.0, latest published}: green
#   means workers of those versions keep working against this server build, so
#   the server can deploy without a coordinated npm release. 404s are judged
#   per capability against its `since` in the registry: tolerated only when
#   the worker predates the capability, failed when it should serve it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  classify-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify diff impact
        run: |
          # PR: diff against the PR base. Push to main (the dev flow here merges
          # locally and pushes main directly — no PR, so origin/main == HEAD and
          # would always diff empty): diff against the LAST RELEASE TAG (v*).
          # That answers the question this job exists for — "what worker-
          # reachable changes have accumulated since the last worker release" —
          # and the gray/wire-contract signal persists in every push's summary
          # until a tag ships it. Fallbacks: github.event.before (no tags),
          # then HEAD~1.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)" && [ -n "$BASE" ]; then
            :
          elif [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          echo "classify-diff base: $BASE"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/classify-diff.mjs "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cross-version-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compat floor: the oldest published worker the fleet can be running.
          # 0.2.0 is the oldest release that speaks reverse-connect at all
          # (0.1.x cannot connect — verified empirically); keep this pinned and
          # move it only when MIN_WORKER_VERSION is raised via the deprecation
          # flow in docs/server-worker-compat-design.md §2.
          - worker: "0.2.0"
          # Newest published worker.
          - worker: latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:main
      - name: Smoke branch server against worker@${{ matrix.worker }}
        run: |
          VER="${{ matrix.worker }}"
          if [ "$VER" = "latest" ]; then VER="$(npm view vibedeckx version)"; fi
          node scripts/cross-version-e2e.mjs "$VER"
