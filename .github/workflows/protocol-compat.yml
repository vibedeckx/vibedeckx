name: protocol-compat

on:
  workflow_dispatch:
    inputs:
      force_matrix:
        description: "Run the live matrix even if no new version detected"
        type: boolean
        default: true
      agent:
        description: "Agent to verify (requires credentials only for the selected agent)"
        type: choice
        default: all
        options:
          - all
          - claude-code
          - codex
          - fx
  # Enable after the matrix has run clean a few times via workflow_dispatch AND a lastSeen-bump step closes the loop — otherwise every upstream release makes the daily cron run the paid matrix forever (agent-versions.json lastSeen is never auto-updated).
  # schedule:
  #   - cron: "17 3 * * *" # daily; version-check only — matrix runs when a new version appears

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      run_matrix: ${{ steps.check.outputs.run_matrix }}
      claude_latest: ${{ steps.check.outputs.claude_latest }}
      codex_latest: ${{ steps.check.outputs.codex_latest }}
      fx_latest: ${{ steps.check.outputs.fx_latest }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          AGENT_FILTER: ${{ inputs.agent || 'all' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const agents = [
            { agent: 'claude-code', package: '@anthropic-ai/claude-code', file: 'claude.live.test.ts' },
            { agent: 'codex', package: '@openai/codex', file: 'codex.live.test.ts' },
            { agent: 'fx', file: 'fx.live.test.ts' },
          ];
          const selected = agents.filter(a => process.env.AGENT_FILTER === 'all' || a.agent === process.env.AGENT_FILTER);
          if (!selected.length) throw new Error('Unknown agent filter');
          const include = selected.flatMap(a => ['pinned', 'latest'].map(channel => ({ ...a, channel })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          JS
      - id: check
        run: |
          CLAUDE_LATEST=$(npm view @anthropic-ai/claude-code version)
          CODEX_LATEST=$(npm view @openai/codex version)
          FX_LATEST=$(curl -fsSL https://releases.fx.sh/latest.txt | tr -d '[:space:]')
          [[ "$FX_LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          CLAUDE_SEEN=$(jq -r '."claude-code".lastSeen' .github/agent-versions.json)
          CODEX_SEEN=$(jq -r '.codex.lastSeen' .github/agent-versions.json)
          FX_SEEN=$(jq -r '.fx.lastSeen' .github/agent-versions.json)
          echo "claude_latest=$CLAUDE_LATEST" >> "$GITHUB_OUTPUT"
          echo "codex_latest=$CODEX_LATEST" >> "$GITHUB_OUTPUT"
          echo "fx_latest=$FX_LATEST" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force_matrix }}" = "true" ] || [ "$CLAUDE_LATEST" != "$CLAUDE_SEEN" ] || [ "$CODEX_LATEST" != "$CODEX_SEEN" ] || [ "$FX_LATEST" != "$FX_SEEN" ]; then
            echo "run_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_matrix=false" >> "$GITHUB_OUTPUT"
          fi

  live-matrix:
    needs: version-check
    if: needs.version-check.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version-check.outputs.matrix) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIBEDECKX_COMPAT_REQUIRED: "1"
      FX_AUTO_UPGRADE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve agent version
        id: ver
        env:
          FX_LATEST: ${{ needs.version-check.outputs.fx_latest }}
        run: |
          if [ "${{ matrix.channel }}" = "pinned" ]; then
            V=$(jq -r '."${{ matrix.agent }}".pinned' .github/agent-versions.json)
          elif [ "${{ matrix.agent }}" = "fx" ]; then
            V="$FX_LATEST"
          else
            V=$(npm view ${{ matrix.package }} version)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Install agent CLI
        if: matrix.agent != 'fx'
        run: npm install -g ${{ matrix.package }}@${{ steps.ver.outputs.version }}
      - name: Install fx CLI
        if: matrix.agent == 'fx'
        env:
          FX_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsSL https://fx.sh/setup.sh -o "$RUNNER_TEMP/fx-setup.sh"
          bash "$RUNNER_TEMP/fx-setup.sh" "$FX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check fx CI authentication
        if: matrix.agent == 'fx'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          test -n "$AI_GATEWAY_API_KEY" || { echo 'Missing AI_GATEWAY_API_KEY secret for fx live probes'; exit 1; }
          fx --version
          fx provider gateway
      - name: Codex headless login
        # codex has no ambient-env-var auth path: `codex login --with-api-key`
        # reads the key from stdin and persists it to $CODEX_HOME/auth.json
        # (verified via `codex login --help` — see agent-versions.json research
        # notes / Task 11 report). Runs only for the codex matrix cells.
        if: matrix.agent == 'codex'
        run: printenv OPENAI_API_KEY | codex login --with-api-key
      - name: Live probes (${{ matrix.agent }} @ ${{ steps.ver.outputs.version }})
        env:
          AI_GATEWAY_API_KEY: ${{ matrix.agent == 'fx' && secrets.AI_GATEWAY_API_KEY || '' }}
        run: pnpm --filter vibedeckx test:compat src/protocol/live/${{ matrix.file }}

  report-drift:
    needs: [version-check, live-matrix]
    if: always() && needs.live-matrix.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          CLAUDE_LATEST: ${{ needs.version-check.outputs.claude_latest }}
          CODEX_LATEST: ${{ needs.version-check.outputs.codex_latest }}
          FX_LATEST: ${{ needs.version-check.outputs.fx_latest }}
        with:
          script: |
            const title = `protocol-compat: live matrix failure (claude latest ${process.env.CLAUDE_LATEST}, codex latest ${process.env.CODEX_LATEST}, fx latest ${process.env.FX_LATEST})`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "protocol-compat: live matrix failure"`,
            });
            if (existing.data.total_count > 0) {
              core.info("open drift issue already exists; skipping");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "The protocol-compat live matrix failed.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "- `pinned` cell failing ⇒ likely our bug (or CI env).",
                "- `latest` cell failing ⇒ likely upstream protocol drift — check the job log for contract IDs (CC-*/CX-*/FX-*) and consumer pointers.",
                "",
                "Contracts live in `packages/vibedeckx/src/protocol/*/schema.ts`; the failing scenario names the guarded behavior.",
              ].join("\n"),
              labels: ["protocol-compat"],
            });
