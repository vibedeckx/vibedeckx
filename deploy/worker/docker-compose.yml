# Vibedeckx reverse-connect worker — run config.
#
# Build the image once from the repo: ./deploy/worker/build.sh
# Then, next to this file:
#   1. put the connect token in ./secrets/connect-token (from the hub:
#      Settings → Remote Servers). The container user is uid 1000, so make it
#      readable by that uid (`chmod 600` + owned by uid 1000, or `chmod 644`
#      on a single-user host).
#   2. set VIBEDECKX_CONNECT_TO below (or in a .env file next to this one).
#   3. docker compose up -d
#
# Lifecycle (host side):
#   docker compose stop                        stop; stays stopped across reboots
#   docker compose start | restart             start / restart
#   docker compose exec worker vibedeckx connect status
#   docker compose down                        remove the container (volumes kept)
#
# To rotate the token, replace ./secrets/connect-token (in place or by
# rename); the worker picks it up without a restart. The secrets DIRECTORY is
# mounted rather than the file on purpose: a single-file bind mount is pinned
# to the file's inode, so a rename-replace on the host would never reach the
# container.
services:
  worker:
    image: ${VIBEDECKX_WORKER_IMAGE:-vibedeckx-worker:local}
    # Recover crashes; start with dockerd at boot. Never give up.
    restart: unless-stopped
    # tini as PID 1 reaps orphaned agent processes.
    init: true
    # Outbound-only: the worker dials the hub; nothing needs to be published.
    environment:
      VIBEDECKX_CONNECT_TO: ${VIBEDECKX_CONNECT_TO:?set VIBEDECKX_CONNECT_TO to the hub URL}
      VIBEDECKX_CONNECT_TOKEN_FILE: /run/vibedeckx-secrets/connect-token
    volumes:
      - ${VIBEDECKX_SECRETS_DIR:-./secrets}:/run/vibedeckx-secrets:ro
      - vibedeckx-data:/data
      - vibedeckx-home:/home/node
      - vibedeckx-worktrees:/var/tmp/vibedeckx/worktrees
      - ${VIBEDECKX_PROJECTS_DIR:-./projects}:/projects
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vibedeckx-data:
  vibedeckx-home:
  vibedeckx-worktrees:
